name: MIIT schedule bot tick

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: miit-schedule-bot-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run one bot tick
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          REMIND_BEFORE_MINUTES: ${{ vars.REMIND_BEFORE_MINUTES }}
          REMINDER_WINDOW_MINUTES: ${{ vars.REMINDER_WINDOW_MINUTES }}
          REFRESH_SCHEDULE_MINUTES: ${{ vars.REFRESH_SCHEDULE_MINUTES }}
          TIMEZONE: ${{ vars.TIMEZONE }}
        run: python run_once.py

      - name: Persist bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          files_to_add=""
          for f in users.json notified.json schedule_cache.json update_offset.json; do
            if [ -f "data/$f.enc" ]; then
              files_to_add="$files_to_add data/$f.enc"
            elif [ -f "data/$f" ]; then
              files_to_add="$files_to_add data/$f"
            fi
          done
          if [ -z "$files_to_add" ]; then
            echo "Файлов состояния пока нет, коммитить нечего"
            exit 0
          fi
          git add -f $files_to_add
          if git diff --cached --quiet; then
            echo "Состояние не изменилось, коммитить нечего"
            exit 0
          fi
          git commit -m "chore: bot state update"
          git pull --rebase --autostash
          git push
